# =============================================================================
#  nginx — service du front Alryck
# =============================================================================
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonde Kubernetes. Elle doit repondre sans toucher au disque applicatif ni dependre de
    # l'API : c'est la sante de CE conteneur qu'on mesure, pas celle du systeme.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Les fichiers produits par Vite portent une empreinte dans leur nom : leur contenu ne
    # change jamais pour une empreinte donnee, on peut donc les mettre en cache sans limite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html n'est JAMAIS mis en cache : c'est lui qui reference les empreintes des
    # bundles. Le mettre en cache figerait les utilisateurs sur l'ancienne version apres un
    # deploiement — le bug le plus classique et le plus long a diagnostiquer d'un front SPA.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Routage cote client : toute adresse inconnue rend index.html, et c'est React Router qui
    # decide. Sans cette regle, un rechargement sur /Evenements donnerait un 404 nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-tetes de securite. Pas de Content-Security-Policy ici : le front charge des images
    # depuis media.base44.com et des tuiles Leaflet, une politique posee a l'aveugle casserait
    # ces ecrans. A ecrire explicitement lors du nettoyage du lot L7.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
